plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.yancey.cleftassist'
version = '0.1.0'

android {
  namespace "com.yancey.cleftassist"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // The assistant card is a second React Native screen (AssistActivity), over whatever app is open.
  // No version: React Native's Gradle plugin pins it to the app's own, as for expo-modules-core.
  implementation 'com.facebook.react:react-android'
  // For the card's see-through theme (its parent is an AppCompat theme, which ReactActivity needs).
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
