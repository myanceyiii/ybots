<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YBots</title>
<link rel="stylesheet" href="page.css">
</head>
<body>
<main>
  <h1 id="title">Can't reach YBots</h1>
  <p id="hint">YBots did not answer.</p>
  <div class="card">
    <p class="status-line" id="countdown" role="status" aria-live="polite"></p>
    <div class="row">
      <button type="button" class="secondary" id="change">Change address</button>
      <button type="button" id="retry">Try again now</button>
    </div>
    <details>
      <summary>Things to check</summary>
      <ol>
        <li>This computer is online.</li>
        <li>Tailscale is on and signed in, if your address ends in ts.net.</li>
        <li>The computer that runs YBots is switched on, and YBots is running on it.</li>
      </ol>
      <p class="hint" id="where"></p>
      <p class="hint" id="reason"></p>
    </details>
  </div>
</main>
<script src="offline.js"></script>
</body>
</html>
