<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
<title>YBots Quick Chat</title>
<link rel="stylesheet" href="quick.css">
</head>
<body>
<main class="quick">
  <div class="bots" id="bots" role="radiogroup" aria-label="Send to"></div>
  <textarea id="text" rows="3" placeholder="Message" aria-label="Message" maxlength="20000"></textarea>
  <div class="files" id="files" aria-label="Attached" hidden></div>
  <div class="foot">
    <button type="button" class="icon" id="shot" title="Add a screenshot of this screen (Ctrl+Shift+S)" aria-label="Add a screenshot of this screen">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
    </button>
    <button type="button" class="icon" id="attach" title="Attach files (Ctrl+O)" aria-label="Attach files">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 11.5l-7.8 7.8a5 5 0 0 1-7-7l8.1-8.1a3.4 3.4 0 0 1 4.8 4.8l-8 8a1.8 1.8 0 0 1-2.6-2.6l7.3-7.3"/></svg>
    </button>
    <span class="status" id="status" role="status" aria-live="polite"></span>
    <button type="button" class="link" id="open">Open chat</button>
    <button type="button" id="send" disabled>Send</button>
  </div>
</main>
<script src="quick.js"></script>
</body>
</html>
