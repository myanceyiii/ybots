# Slack app manifest for the Sheldon link (docs/sheldon-link.md). Same app as cleft-app-manifest.json.
# No bot user on purpose: posts from an app with a bot user carry bot_id, and Sheldon's ChatGPT agent
# did not wake for those. Everything runs on the installer's user token.
display_information:
  name: Cleft
  description: Lets the Cleft bots talk with Sheldon in #assistants.
oauth_config:
  scopes:
    user:
      - chat:write
      - channels:history
      - channels:read
settings:
  event_subscriptions:
    user_events:
      - message.channels
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
